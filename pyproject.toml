[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bidsentry"
version = "4.2.0"
description = "Sistem Audit Dokumen Pengadaan & Deteksi Dini Anomali Tender LPSE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
    "pdfplumber>=0.11,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "networkx>=3.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "python-docx>=1.1,<2",
    "reportlab>=4.0,<6",
    "ibm-watsonx-ai>=1.1,<2",
    "openpyxl>=3.1,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Async audit job engine (BIDSENTRY_JOB_ENGINE=redis); the web UI does not need it.
jobs = [
    "arq>=0.28,<0.29",
    "redis>=5.0,<6",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "aiosqlite>=0.20,<1",
    "pydantic-settings>=2.2,<3",
]
# Alternative LLM providers besides IBM watsonx.ai.
providers = [
    "google-genai>=2.0,<3",
    "openai>=1.30,<3",
]
dev = [
    "bidsentry[jobs,providers]",
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["bidsentry*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated.*:Warning",
    "ignore:Setting per-request cookies=.*is being deprecated.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 200
extend-exclude = ["data", "docs", "langflow"]

[tool.ruff.lint]
# Pyflakes (unused/undefined names) and syntax errors; style is left to review.
select = ["E9", "F"]
